[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-ego-mint"
version = "0.1.0"
description = "Open egocentric video data, training, inference, and visualization toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{ name = "MINT Contributors" }]
keywords = ["egocentric-vision", "hand-pose", "camera-tracking", "ray", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "decord==0.6.0",
  "einops==0.8.2",
  "Flask==3.1.3",
  "huggingface-hub==1.20.1",
  "lz4>=4.4,<5",
  "mcap==1.4.0",
  "modelscope==1.37.1",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "safetensors==0.8.0",
  "scipy==1.15.3",
  "smplx==0.1.28",
  "tqdm==4.68.3",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
train = [
  "accelerate==1.14.0",
  "pandas==2.3.3",
  "wandb==0.28.0",
]
data = [
  "joblib==1.5.3",
  "natsort==8.4.0",
  "nvidia-ml-py==13.610.43",
  "ray[default]==2.55.1",
  "ultralytics==8.4.23",
]
dev = [
  "build==1.3.0",
  "pre-commit==4.5.1",
  "ruff==0.15.5",
]

[project.urls]
Documentation = "https://github.com/1847540790/wuji-ego-mint#readme"
Issues = "https://github.com/1847540790/wuji-ego-mint/issues"
Source = "https://github.com/1847540790/wuji-ego-mint"

[tool.setuptools.packages.find]
include = ["mint*"]

[tool.setuptools.package-data]
"mint.viewer" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
